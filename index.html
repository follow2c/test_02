<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 반 분리수거 마스터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#fe4e00',
                            secondary: '#5ab1bb',
                            accent: '#9046cf',
                            dark: '#1a1a1a'
                        }
                    },
                    fontFamily: {
                        sans: ['BusanDandiMyeongjo', 'serif', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'BusanDandiMyeongjo';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610132210@l-2/l/부산단디명조L.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'BusanDandiMyeongjo';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610132210@l-2/l/부산단디명조M.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'BusanDandiMyeongjo';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610132210@l-2/l/부산단디명조B.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        body {
            font-family: 'BusanDandiMyeongjo', serif, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 antialiased font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-[#fe4e00] text-white px-4 sm:px-8 py-3.5 flex justify-between items-center shadow-md sticky top-0 z-30 shrink-0">
        <h1 class="text-lg sm:text-xl font-black flex items-center gap-2 cursor-pointer select-none" onclick="navigateTo('home')">
            <span class="material-symbols-outlined text-2xl sm:text-3xl">eco</span>
            <span>우리 반 분리수거 마스터</span>
        </h1>
        <div class="flex items-center gap-2">
            <button onclick="openApiKeyModal()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-full font-medium text-xs flex items-center gap-1 transition">
                <span class="material-symbols-outlined text-base">key</span>
                <span class="hidden sm:inline">API 설정</span>
            </button>
            <button onclick="navigateTo('add')" class="bg-white text-[#fe4e00] px-3.5 py-1.5 rounded-full font-bold text-xs sm:text-sm flex items-center gap-1 hover:bg-orange-100 transition active:scale-95 shadow-xs">
                <span class="material-symbols-outlined text-base">add</span>
                <span class="hidden sm:inline">직접 등록</span>
            </button>
        </div>
    </header>

    <!-- Main Dynamic Responsive Layout Area -->
    <main class="flex-1 w-full max-w-4xl mx-auto p-4 sm:p-6 pb-24">
        <div id="main-content" class="w-full">
            <!-- Dynamic view screens will be injected here via JS -->
        </div>
    </main>

    <!-- Bottom Mobile Nav Bar -->
    <nav class="bg-white border-t border-gray-200 py-2.5 px-6 flex justify-around items-center fixed bottom-0 left-0 right-0 z-20 shadow-lg max-w-4xl mx-auto md:rounded-t-2xl">
        <button onclick="navigateTo('home')" id="nav-home" class="flex flex-col items-center gap-0.5 text-[#fe4e00] transition active:scale-90">
            <span class="material-symbols-outlined text-2xl">home</span>
            <span class="text-[11px] font-bold">홈</span>
        </button>
        <button onclick="navigateTo('search')" id="nav-search" class="flex flex-col items-center gap-0.5 text-gray-400 transition active:scale-90">
            <span class="material-symbols-outlined text-2xl">search</span>
            <span class="text-[11px] font-medium">검색/목록</span>
        </button>
        <button onclick="navigateTo('add')" id="nav-add" class="flex flex-col items-center gap-0.5 text-gray-400 transition active:scale-90">
            <span class="material-symbols-outlined text-2xl">add_circle</span>
            <span class="text-[11px] font-medium">등록하기</span>
        </button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-2.5 rounded-full text-xs font-medium opacity-0 pointer-events-none transition-all duration-300 shadow-xl z-50 flex items-center gap-2">
        <span class="material-symbols-outlined text-sm text-[#5ab1bb]">check_circle</span>
        <span id="toast-message">알림 메시지</span>
    </div>

    <!-- Non-Auto-Closing Error Modal -->
    <div id="error-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto">
                <span class="material-symbols-outlined text-2xl">error_med</span>
            </div>
            <div>
                <h3 class="font-black text-gray-900 text-base" id="error-modal-title">오류 발생</h3>
                <p class="text-xs text-gray-600 mt-2 leading-relaxed text-left bg-gray-50 p-3 rounded-xl border border-gray-100 font-mono break-all max-h-40 overflow-y-auto" id="error-modal-desc">
                    상세 오류 정보가 표시됩니다.
                </p>
            </div>
            <button onclick="closeErrorModal()" class="w-full py-2.5 bg-[#fe4e00] text-white text-xs font-bold rounded-xl hover:bg-orange-600 transition">
                확인
            </button>
        </div>
    </div>

    <!-- API Key Settings Modal -->
    <div id="api-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                    <span class="material-symbols-outlined text-[#fe4e00]">key</span>
                    API 키 설정
                </h3>
                <button onclick="closeApiKeyModal()" class="text-gray-400 hover:text-gray-600">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
            <div class="space-y-3 text-xs">
                <p class="text-gray-600 leading-relaxed">
                    Google Gemini API 키를 입력하면 카메라 촬영을 통한 실시간 AI 쓰레기 인식이 가능해집니다. 키는 기기 내에 암호화되어 안전하게 보관됩니다.
                </p>
                <div>
                    <label class="font-bold text-gray-700 block mb-1">Gemini API Key</label>
                    <input type="password" id="gemini-key-input" placeholder="AIzaSy..." autocomplete="off" class="w-full p-3 border border-gray-200 rounded-xl focus:border-[#fe4e00] focus:outline-none">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeApiKeyModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-600 text-xs font-bold rounded-xl hover:bg-gray-200 transition">취소</button>
                <button onclick="saveApiKey()" class="flex-1 py-2.5 bg-[#fe4e00] text-white text-xs font-bold rounded-xl hover:bg-orange-600 transition">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Hidden Camera File Input -->
    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoSelect(event)">

    <!-- Application Script -->
    <script>
        // State Management
        let geminiApiKey = localStorage.getItem('GEMINI_API_KEY') || '';

        let garbageItems = [
            {
                id: 1,
                name: "음료수 플라스틱 캔/병",
                category: "플라스틱",
                method: "1. 내용물을 깨끗이 비우고 물로 헹꿉니다.\n2. 라벨 비닐을 떼어 비닐류에 버립니다.\n3. 뚜껑을 닫고 플라스틱 함에 배출합니다.",
                tip: "상표 라벨 비닐을 꼭 떼어주는 것이 핵심입니다!",
                color: "bg-blue-100 text-blue-800",
                icon: "local_drink"
            },
            {
                id: 2,
                name: "컵라면 종이용기",
                category: "일반쓰레기 / 종이",
                method: "1. 국물 자국이 심하게 남아 빨갛게 물든 용기는 재활용이 불가능하므로 '일반쓰레기'에 버립니다.\n2. 세척되어 이물질이 없는 깨끗한 종이용기만 종이류로 배출합니다.",
                tip: "음식물이 든 채로 버리면 악취의 원인이 돼요!",
                color: "bg-red-100 text-red-800",
                icon: "ramen_dining"
            },
            {
                id: 3,
                name: "우유팩 / 팩음료",
                category: "종이팩",
                method: "1. 빨대를 뺀 후 빨대는 '플라스틱'에 버립니다.\n2. 우유팩을 잘라 내부를 물로 헹구고 건조시킵니다.\n3. 펼쳐서 종이팩 전용함에 배출합니다.",
                tip: "빨대 감싸는 비닐은 비닐류에 따로 배출하세요.",
                color: "bg-emerald-100 text-emerald-800",
                icon: "nutrition"
            },
            {
                id: 4,
                name: "과자 봉지 / 라면 봉지",
                category: "비닐류",
                method: "1. 봉지 안의 과자 부스러기와 먼지를 털어냅니다.\n2. 이물질이 묻은 경우 물로 가볍게 씻어 말립니다.\n3. 딱지 모양으로 접지 말고 평평하게 펼쳐 비닐 수거함에 버립니다.",
                tip: "딱지로 접어 버리면 재활용 분류 기계가 인식하기 어려워요!",
                color: "bg-purple-100 text-purple-800",
                icon: "inventory_2"
            }
        ];

        let currentView = 'home';
        let currentDetailId = null;

        // UI Helpers
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            if (toastMsg) toastMsg.innerText = message;
            if (toast) {
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2800);
            }
        }

        function maskSensitiveString(str) {
            if (!str) return '';
            return str.replace(/key=([^&]+)/g, 'key=***HIDDEN***');
        }

        function showErrorModal(title, message) {
            const modal = document.getElementById('error-modal');
            const modalTitle = document.getElementById('error-modal-title');
            const modalDesc = document.getElementById('error-modal-desc');
            if (modalTitle) modalTitle.innerText = title;
            if (modalDesc) modalDesc.innerText = maskSensitiveString(message);
            if (modal) modal.classList.remove('hidden');
        }

        function closeErrorModal() {
            const modal = document.getElementById('error-modal');
            if (modal) modal.classList.add('hidden');
        }

        function openApiKeyModal() {
            const modal = document.getElementById('api-modal');
            const input = document.getElementById('gemini-key-input');
            if (input) input.value = geminiApiKey;
            if (modal) modal.classList.remove('hidden');
        }

        function closeApiKeyModal() {
            const modal = document.getElementById('api-modal');
            if (modal) modal.classList.add('hidden');
        }

        function saveApiKey() {
            const input = document.getElementById('gemini-key-input');
            if (input) {
                geminiApiKey = input.value.trim();
                localStorage.setItem('GEMINI_API_KEY', geminiApiKey);
                showToast("Gemini API 키가 안전하게 저장되었습니다.");
            }
            closeApiKeyModal();
        }

        // Router & Renderer
        function navigateTo(view, param = null) {
            currentView = view;
            const container = document.getElementById('main-content');
            
            // Nav Bar Highlight Update
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "flex flex-col items-center gap-0.5 text-gray-400 transition active:scale-90";
            });
            const activeNav = document.getElementById(`nav-${view}`);
            if (activeNav) {
                activeNav.className = "flex flex-col items-center gap-0.5 text-[#fe4e00] transition active:scale-90 font-bold";
            }

            if (view === 'home') renderHome(container);
            else if (view === 'search') renderSearchList(container, param || '');
            else if (view === 'detail') renderDetail(container, param);
            else if (view === 'add') renderAddForm(container);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 1. Home View
        function renderHome(container) {
            container.innerHTML = `
                <div class="space-y-5">
                    <!-- Title Banner -->
                    <div class="bg-[#5ab1bb] text-white p-6 rounded-3xl shadow-xs text-center md:text-left md:flex md:items-center md:justify-between">
                        <div>
                            <span class="text-xs font-bold text-[#9046cf] bg-white px-3 py-1 rounded-full uppercase tracking-wider inline-block mb-2 shadow-2xs">쉬는 시간 3초 가이드</span>
                            <h2 class="text-2xl sm:text-3xl font-black tracking-tight">우리 반 분리수거 마스터</h2>
                            <p class="text-xs sm:text-sm text-cyan-50 mt-1 font-medium">고등학생 쉬는 시간을 위한 빠르고 정확한 에코 라이프 가이드</p>
                        </div>
                        <div class="hidden md:block">
                            <span class="material-symbols-outlined text-6xl text-white/80">eco</span>
                        </div>
                    </div>

                    <!-- Main Action Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div onclick="triggerCameraInput()" class="bg-gradient-to-r from-[#fe4e00] to-orange-500 text-white p-6 rounded-3xl shadow-md cursor-pointer hover:opacity-95 active:scale-98 transition flex items-center gap-4 border border-orange-400 relative overflow-hidden">
                            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center shrink-0 backdrop-blur-sm">
                                <span class="material-symbols-outlined text-4xl text-white">photo_camera</span>
                            </div>
                            <div>
                                <span class="bg-white/20 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider mb-1 inline-block">Gemini Vision AI</span>
                                <h3 class="text-lg font-extrabold">사진 찍어 분리배출 찾기</h3>
                                <p class="text-xs text-orange-100 mt-0.5">카메라로 쓰레기를 찍으면 AI가 인식하고 가이드를 제공해요!</p>
                            </div>
                        </div>

                        <div onclick="navigateTo('search')" class="bg-white p-6 rounded-3xl shadow-md cursor-pointer hover:border-[#fe4e00] border-2 border-transparent transition flex items-center gap-4">
                            <div class="w-16 h-16 bg-orange-100 rounded-2xl flex items-center justify-center shrink-0">
                                <span class="material-symbols-outlined text-4xl text-[#fe4e00]">search</span>
                            </div>
                            <div>
                                <h3 class="text-lg font-extrabold text-gray-900">쓰레기 이름으로 찾기</h3>
                                <p class="text-xs text-gray-500 mt-0.5">헷갈리는 분리수거 품목을 키워드로 빠르게 검색해보세요.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Categories -->
                    <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-xs border border-gray-100 space-y-3">
                        <h3 class="text-sm font-bold text-gray-900 flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-[#fe4e00]">category</span>
                            자주 버리는 카테고리
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                            <button onclick="navigateTo('search', '플라스틱')" class="p-3 bg-blue-50/70 hover:bg-blue-100/70 rounded-2xl text-left transition border border-blue-100 flex flex-col justify-between h-20">
                                <span class="material-symbols-outlined text-blue-600 text-2xl">local_drink</span>
                                <span class="text-xs font-bold text-blue-900">플라스틱</span>
                            </button>
                            <button onclick="navigateTo('search', '종이')" class="p-3 bg-emerald-50/70 hover:bg-emerald-100/70 rounded-2xl text-left transition border border-emerald-100 flex flex-col justify-between h-20">
                                <span class="material-symbols-outlined text-emerald-600 text-2xl">description</span>
                                <span class="text-xs font-bold text-emerald-900">종이 / 팩</span>
                            </button>
                            <button onclick="navigateTo('search', '비닐')" class="p-3 bg-purple-50/70 hover:bg-purple-100/70 rounded-2xl text-left transition border border-purple-100 flex flex-col justify-between h-20">
                                <span class="material-symbols-outlined text-purple-600 text-2xl">inventory_2</span>
                                <span class="text-xs font-bold text-purple-900">비닐류</span>
                            </button>
                            <button onclick="navigateTo('search', '일반')" class="p-3 bg-red-50/70 hover:bg-red-100/70 rounded-2xl text-left transition border border-red-100 flex flex-col justify-between h-20">
                                <span class="material-symbols-outlined text-red-600 text-2xl">delete</span>
                                <span class="text-xs font-bold text-red-900">일반 쓰레기</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. Search & List View
        function renderSearchList(container, keyword = '') {
            const filteredItems = getFilteredItems(keyword);

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="relative">
                        <input type="text" id="search-input" value="${keyword}" oninput="handleSearchInput(event)" placeholder="어떤 쓰레기를 버리시나요? (예: 음료수, 라면)" 
                            class="w-full pl-11 pr-10 py-3.5 bg-white border-2 border-gray-200 rounded-2xl text-sm focus:border-[#fe4e00] focus:outline-none shadow-xs transition">
                        <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-gray-400">search</span>
                        <button id="clear-search-btn" onclick="clearSearchInput()" class="${keyword ? '' : 'hidden'} absolute right-3 top-3.5 text-gray-400 hover:text-gray-600">
                            <span class="material-symbols-outlined text-sm">close</span>
                        </button>
                    </div>

                    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                        <button onclick="navigateTo('search', '')" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${keyword === '' ? 'bg-[#fe4e00] text-white' : 'bg-white text-gray-600 border border-gray-200'}">전체</button>
                        <button onclick="navigateTo('search', '플라스틱')" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${keyword === '플라스틱' ? 'bg-[#fe4e00] text-white' : 'bg-white text-gray-600 border border-gray-200'}">플라스틱</button>
                        <button onclick="navigateTo('search', '종이')" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${keyword === '종이' ? 'bg-[#fe4e00] text-white' : 'bg-white text-gray-600 border border-gray-200'}">종이/팩</button>
                        <button onclick="navigateTo('search', '비닐')" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${keyword === '비닐' ? 'bg-[#fe4e00] text-white' : 'bg-white text-gray-600 border border-gray-200'}">비닐류</button>
                    </div>

                    <div class="flex justify-between items-center text-xs text-gray-500 px-1">
                        <span>검색 결과 <b id="result-count" class="text-[#fe4e00] font-bold">${filteredItems.length}</b>개</span>
                    </div>

                    <div id="search-item-list" class="space-y-2.5">
                        ${renderItemListHTML(filteredItems)}
                    </div>
                </div>
            `;
        }

        function getFilteredItems(keyword) {
            return garbageItems.filter(item => 
                item.name.toLowerCase().includes(keyword.toLowerCase()) || 
                item.category.toLowerCase().includes(keyword.toLowerCase())
            );
        }

        function renderItemListHTML(filteredItems) {
            if (filteredItems.length > 0) {
                return filteredItems.map(item => `
                    <div onclick="navigateTo('detail', ${item.id})" class="bg-white p-4 sm:p-5 rounded-2xl shadow-xs border border-gray-100 hover:border-[#fe4e00] transition active:scale-98 cursor-pointer flex justify-between items-center">
                        <div class="flex items-center gap-3.5">
                            <div class="w-11 h-11 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 shrink-0 overflow-hidden relative">
                                ${item.imageUrl ? `<img src="${item.imageUrl}" alt="" onerror="this.style.
